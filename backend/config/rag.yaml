# SageMatch RAG 数值参数（后端权威源，不进管理端）。
# 路径：backend/config/rag.yaml。改完后重启 uvicorn 才会生效。
# embedding / rerank 先占位，词法召回仍走 recall 段。

chunk:
  # 切分窗口，单位 token：一个英文单词 / 一串数字 / 一个汉字 / 一处标点各算 1 token
  size: 720
  overlap: 120

recall:
  # 返回条数
  top_k: 10
  # 低于此分的 chunk 直接丢掉
  score_floor: 0.0
  # Query 整句出现在 chunk 里时的加分，总分仍封顶 1.0
  exact_match_bonus: 0.35

generation:
  # 角色表没绑温度时用这里；有绑定时角色温度优先
  temperature: 0.7
  # 核采样。1.0 = 不截断
  top_p: 1.0
  max_tokens: 900

embedding:
  # 向量模型不走管理端角色。模型、地址、密钥都写在这里；密钥留空则只做词法切块。
  # 维度必须保持 1024。千问可用 text-embedding-v3（不要用对话模型，例如 qwen3.8-flash）。
  enabled: true
  model: "qwen3.7-text-embedding-flash"
  base_url: "https://maas.qianwenaiapi.com/compatible-mode/v1"
  api_key: "sk-ws-H.PIXXHXE.XegJ.MEUCIQCNMURbdPtzVfDakpqr_eh_6t6bIlySZToTKOrwANDnBAIgdb2ULXIXjnVqqZzlwe4FDe1nKvDiW7bnpSQf7z_pk3Y"
  dimensions: 1024
  batch_size: 32
  similarity: cosine
  # 向量分与词法分混合：vector * (1-w) + lexical * w
  lexical_weight: 0.35

rerank:
  enabled: false
  top_n: 20
